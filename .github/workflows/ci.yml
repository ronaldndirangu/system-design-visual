name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer pull request push cancels the older run. Runs on main queue instead, so a deploy never stops halfway;
# GitHub keeps only the newest pending run, so the latest commit still deploys.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, type check, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1
          include-hidden-files: true

  # Browser tests run on pull requests and main pushes that touch code, config, or the tests themselves, so a layout
  # regression blocks the pull request before it reaches main. Content-only changes skip them. Nightly runs cover all.
  playwright-version:
    name: Resolve Playwright version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.lockfile.outputs.version }}
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A pull request checks out its merge commit, whose first parent is the current base.
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          code='^(src/(components|lib|styles|layouts|pages)/|tests/e2e/|playwright\.config|astro\.config|package\.json|pnpm-lock\.yaml|\.github/workflows/)'
          case "$EVENT" in
            push) base="$BEFORE" ;;
            pull_request) base="HEAD^1" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! changed="$(git diff --name-only "$base" HEAD 2>/dev/null)"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$changed" | grep -qE "$code"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Content-only change: skipping browser tests."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - id: lockfile
        run: |
          versions="$(grep -oP "^  '@playwright/test@\K[0-9]+\.[0-9]+\.[0-9]+(?=':)" pnpm-lock.yaml | sort -u)"
          if [ "$(printf '%s\n' "$versions" | grep -c .)" -ne 1 ]; then
            echo "::error file=pnpm-lock.yaml::Expected one @playwright/test version, found: ${versions:-none}"
            exit 1
          fi
          echo "version=$versions" >> "$GITHUB_OUTPUT"

  # The official image ships Chromium and its system libraries, so this job never calls apt.
  # Its tag follows the lockfile, which keeps the browser build matched to @playwright/test.
  # Three shards split the suite so a run takes a few minutes; a failing shard leaves the others running.
  e2e:
    name: Browser tests (shard ${{ matrix.shard }} of 3)
    needs: [verify, playwright-version]
    if: ${{ needs.playwright-version.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/3
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # The one required check for merging. It passes when verify passes and browser tests pass or skip, which lets
  # auto-merge wait for the shards on code changes and merge content-only changes after verify.
  result:
    name: CI result
    needs: [verify, playwright-version, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed jobs: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done

  # Publishes the dist/ that verify built, so a commit that fails lint, type checks, unit tests, or the build never
  # deploys. On main, browser tests run alongside and report regressions without holding back content.
  deploy:
    name: Deploy to GitHub Pages
    needs: [verify]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
